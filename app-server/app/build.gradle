plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }

android {
    namespace = "org.jellyfin.shieldserver"
    compileSdk = 34
    buildFeatures { buildConfig = true }
    kotlinOptions { jvmTarget = "1.8" }
    defaultConfig {
        applicationId = "org.jellyfin.shieldserver"
        minSdk = 26
        targetSdk = 26
        ndk { abiFilters "arm64-v8a" }
    }
    // Le pattern par défaut ignore les fichiers point (glob « . ») : il exclurait
    // assets/server/.stamp exigé par ServerService (STAMP_ASSET) ; pattern de
    // repli identique au défaut privé du glob dotfile (le tampon est conservé).
    androidResources {
        ignoreAssetsPattern = "!*.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!pictdb:!__MACOSX"
    }
}
dependencies {
    implementation "org.apache.commons:commons-compress:1.27.1"
    implementation "org.tukaani:xz:1.9"
    testImplementation "junit:junit:4.13.2"
}
